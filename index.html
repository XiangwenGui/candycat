<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paws for Candy — Interactive Class Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #2B1B4C;
    --night-deep: #1B1033;
    --night-mid: #3D2C6B;
    --pumpkin: #FF7A33;
    --pumpkin-dark: #E85C1A;
    --cream: #FFF4E3;
    --candy-pink: #FF5C8A;
    --moon: #FFE9B8;
    --ink: #2A2140;

    --cat-black:#33303F;
    --cat-grey:#9296A6;
    --cat-brown:#8A5A34;

    --bg-yellow:#FFD23F;
    --bg-orange:#FF9F45;
    --bg-purple:#C9A6E8;
    --bg-blue:#A6D8F0;
    --bg-red:#E8604A;

    --stage-bg: var(--bg-yellow);
    --cat-color: var(--cat-black);

    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,233,184,0.14), transparent 40%),
      radial-gradient(ellipse at 85% 0%, rgba(255,122,51,0.16), transparent 45%),
      linear-gradient(180deg, var(--night-deep), var(--night) 55%, var(--night-mid));
    color:var(--cream);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- floating decorations ---------- */
  .sky{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .moon{
    position:absolute; top:28px; right:8%; width:70px; height:70px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff9e8, var(--moon) 60%, #E8C97E 100%);
    box-shadow:0 0 40px rgba(255,233,184,0.5);
  }
  .star{position:absolute; background:var(--cream); border-radius:50%; opacity:.7; animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25;} 50%{opacity:.85;}}
  .bat{position:absolute; font-size:0; width:26px; height:14px; animation:flap 5s ease-in-out infinite;}
  .bat svg{width:100%; height:100%; display:block;}
  @keyframes flap{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-14px) rotate(-4deg);}}

  /* ---------- layout ---------- */
  .app{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:22px 18px 40px;}

  .top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(22px,4vw,32px);
    color:var(--cream); letter-spacing:.3px; display:flex; align-items:center; gap:10px;
    text-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  .title .pumpkin-dot{
    width:1.05em; height:1.05em; border-radius:50%; background:var(--pumpkin);
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.15);
    display:inline-block;
  }

  .trail{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06); padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.12);}
  .trail .paw{width:26px; height:26px; opacity:.35; transition:transform .3s ease, opacity .3s ease;}
  .trail .paw.active{opacity:1; transform:scale(1.15);}
  .trail .paw.done svg .pad, .trail .paw.done svg .toe{fill:var(--pumpkin);}
  .trail .connector{width:14px; height:2px; background:rgba(255,255,255,0.2); border-radius:2px;}

  main{display:grid; grid-template-columns: 1.05fr 1fr; gap:22px; align-items:start;}
  @media (max-width:820px){ main{grid-template-columns:1fr;} }

  .stagecard{
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-lg);
    padding:18px;
    position:relative;
  }
  .stage-row{display:flex; gap:14px; align-items:flex-end; justify-content:center;}
  #catStage{width:min(100%,300px); height:auto; filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));}
  .jar-wrap{width:110px; opacity:0; transform:translateY(10px) scale(.9); transition:opacity .4s ease, transform .4s ease; pointer-events:none;}
  .jar-wrap.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}

  .feature{transition:opacity .25s ease, transform .25s ease; transform-origin:center;}
  .feature.hidden{opacity:0; transform:scale(.4);}
  .feature.shown{opacity:1; transform:scale(1);}

  .mascot-line{
    display:flex; gap:10px; align-items:flex-start; margin-top:14px;
    background:rgba(0,0,0,0.18); border-radius:var(--radius-md); padding:12px 14px;
    border:1px dashed rgba(255,255,255,0.25);
  }
  .mascot-line .who{
    font-family:'Baloo 2'; font-weight:700; color:var(--pumpkin); font-size:14px; margin-bottom:2px;
  }
  .mascot-line p{margin:0; font-size:14.5px; line-height:1.5; color:var(--cream); opacity:.92;}

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-lg);
    padding:24px;
    min-height:420px;
    display:flex; flex-direction:column;
  }
  .eyebrow{
    font-family:'Baloo 2'; font-weight:700; font-size:13px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--pumpkin); margin:0 0 6px;
  }
  .step-title{
    font-family:'Baloo 2'; font-weight:800; font-size:clamp(20px,3vw,26px); margin:0 0 8px; color:var(--cream);
  }
  .step-sub{margin:0 0 18px; font-size:15px; line-height:1.55; color:var(--cream); opacity:.85; max-width:52ch;}

  .choices{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:6px;}
  .choices.swatches{grid-template-columns:repeat(3,1fr);}
  @media (max-width:420px){ .choices{grid-template-columns:1fr 1fr;} }

  .choice-card{
    border:2px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05);
    border-radius:var(--radius-md); padding:12px; cursor:pointer; text-align:center;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    color:var(--cream); font-family:'Nunito'; font-weight:700; font-size:14px;
  }
  .choice-card:hover{transform:translateY(-3px);}
  .choice-card:focus-visible{outline:3px solid var(--pumpkin); outline-offset:2px;}
  .choice-card.selected{border-color:var(--pumpkin); background:rgba(255,122,51,0.18); transform:translateY(-3px);}
  .choice-card svg{display:block; margin:0 auto 8px; width:100%; height:64px;}

  .swatch{
    width:100%; aspect-ratio:1; border-radius:14px; margin-bottom:8px;
    border:2px solid rgba(255,255,255,0.25);
  }

  .tray{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;}
  .candy-btn{
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.16); border-radius:16px;
    padding:8px; cursor:pointer; width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, opacity .2s ease;
  }
  .candy-btn:hover{transform:translateY(-3px) scale(1.04);}
  .candy-btn.used{opacity:.3; pointer-events:none;}
  .candy-btn svg{width:38px; height:38px;}

  .jar-status{
    display:inline-block; font-weight:700; font-size:14px; color:var(--cream); opacity:.75;
    margin:0 0 12px;
  }
  .jar-status.full{
    background:linear-gradient(135deg, var(--pumpkin), var(--candy-pink));
    color:#2A1200; opacity:1; padding:8px 16px; border-radius:999px; font-family:'Baloo 2'; font-size:15px;
    animation:popIn .35s ease;
  }
  @keyframes popIn{ 0%{transform:scale(.7); opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }

  .feature-tray{display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; padding-top:14px;}
  .feat-btn{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.16); border-radius:999px; padding:8px 14px 8px 8px;
    cursor:pointer; color:var(--cream); font-weight:700; font-size:13.5px; transition:all .15s ease;
  }
  .feat-btn .dot{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center;}
  .feat-btn.done{border-color:var(--pumpkin); background:rgba(255,122,51,0.16);}
  .feat-btn.done .dot{background:var(--pumpkin);}

  .hint{
    margin-top:14px; font-size:13.5px; color:var(--cream); opacity:.75; display:flex; gap:8px; align-items:flex-start;
  }

  .shape-chip-list{display:flex; flex-direction:column; gap:10px; margin:16px 0 4px;}
  .shape-chip{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.14); border-radius:14px;
    padding:10px 14px; cursor:pointer; color:var(--cream); font-weight:700; font-size:14.5px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .shape-chip:hover{transform:translateX(3px);}
  .shape-chip.active{border-color:var(--pumpkin); background:rgba(255,122,51,0.16);}
  .chip-shape{display:inline-block; flex-shrink:0;}
  .chip-shape.head{width:20px; height:20px; border-radius:50%; background:var(--pumpkin);}
  .chip-shape.ears{width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:15px solid var(--pumpkin);}
  .chip-shape.body{width:28px; height:16px; border-radius:50%; background:var(--pumpkin);}
  .chip-shape.legs{width:13px; height:18px; border-radius:50%; background:var(--pumpkin);}
  .chip-shape.tail{width:24px; height:5px; background:var(--pumpkin); border-radius:3px; transform:rotate(-25deg);}

  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:12px;}
  .btn{
    font-family:'Baloo 2'; font-weight:700; font-size:15px; border:none; cursor:pointer;
    padding:12px 22px; border-radius:999px; transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--pumpkin); color:#2A1200; box-shadow:0 6px 0 var(--pumpkin-dark);}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{background:transparent; color:var(--cream); opacity:.7; border:2px solid rgba(255,255,255,0.2);}
  .btn-ghost:hover{opacity:1;}
  .btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}

  /* intro / finish full-bleed panels */
  .full{grid-column:1/-1; text-align:center; padding:50px 24px;}
  .full h1{font-family:'Baloo 2'; font-size:clamp(28px,5vw,44px); margin:6px 0 10px; font-weight:800;}
  .full p{max-width:56ch; margin:0 auto 22px; opacity:.85; line-height:1.6; font-size:16px;}
  .badge-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:22px 0;}
  .badge{background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15); border-radius:16px; padding:12px 16px; font-size:13.5px; font-weight:700; display:flex; gap:8px; align-items:center;}

  .costume-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .costume-card{width:120px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:var(--radius-md); padding:12px; font-weight:700; font-size:13px;}
  .costume-card svg{width:100%; height:70px; margin-bottom:6px;}

  .confetti{position:fixed; top:-20px; width:9px; height:14px; z-index:5; border-radius:2px; pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="app">
  <div class="top">
    <div class="title"><span class="pumpkin-dot"></span> Paws for Candy</div>
    <div class="trail" id="trail" aria-hidden="true"></div>
  </div>

  <main id="main"></main>
</div>

<script>
/* ============ small SVG helpers ============ */
const NS = "http://www.w3.org/2000/svg";

function pawSVG(cls){
  return `<svg class="paw ${cls||''}" viewBox="0 0 40 40" xmlns="${NS}">
    <ellipse class="pad" cx="20" cy="25" rx="11" ry="9" fill="#fff" opacity=".55"/>
    <circle class="toe" cx="9" cy="10" r="4.4" fill="#fff" opacity=".55"/>
    <circle class="toe" cx="19" cy="6" r="4.6" fill="#fff" opacity=".55"/>
    <circle class="toe" cx="29" cy="10" r="4.4" fill="#fff" opacity=".55"/>
  </svg>`;
}

const CANDY_DEFS = [
  {id:'lol1', big:true, svg:`<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="12" fill="#FF5C8A"/><path d="M20 15 m-9 0 a9 9 0 1 1 18 0 a9 9 0 1 1 -18 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><rect x="18" y="26" width="4" height="12" rx="2" fill="#E8C97E"/></svg>`},
  {id:'lol2', big:true, svg:`<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="12" fill="#A6D8F0"/><path d="M20 15 m-9 0 a9 9 0 1 1 18 0 a9 9 0 1 1 -18 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><rect x="18" y="26" width="4" height="12" rx="2" fill="#E8C97E"/></svg>`},
  {id:'wrap1', big:false, svg:`<svg viewBox="0 0 40 40"><rect x="9" y="14" width="22" height="12" rx="3" fill="#FFD23F"/><path d="M9 20 L2 14 L2 26 Z" fill="#FFD23F"/><path d="M31 20 L38 14 L38 26 Z" fill="#FFD23F"/></svg>`},
  {id:'wrap2', big:false, svg:`<svg viewBox="0 0 40 40"><rect x="9" y="14" width="22" height="12" rx="3" fill="#7C6AD8"/><path d="M9 20 L2 14 L2 26 Z" fill="#7C6AD8"/><path d="M31 20 L38 14 L38 26 Z" fill="#7C6AD8"/></svg>`},
  {id:'gum1', big:false, svg:`<svg viewBox="0 0 40 40"><path d="M20 6 L27 20 L20 34 L13 20 Z" fill="#FF9F45"/></svg>`},
  {id:'gum2', big:false, svg:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="#8FD19E"/></svg>`}
];

const CAT_COLORS = [
  {id:'black', label:'Black', hex:'#33303F'},
  {id:'grey', label:'Grey', hex:'#9296A6'},
  {id:'brown', label:'Brown', hex:'#8A5A34'}
];
const BG_COLORS = [
  {id:'yellow', label:'Yellow', hex:'#FFD23F'},
  {id:'orange', label:'Orange', hex:'#FF9F45'},
  {id:'purple', label:'Light Purple', hex:'#C9A6E8'},
  {id:'blue', label:'Light Blue', hex:'#A6D8F0'},
  {id:'red', label:'Red', hex:'#E8604A'}
];
const POSES = [
  {id:'sit', label:'Sitting Pretty'},
  {id:'reach', label:'Reaching Up'},
  {id:'stretch', label:'Big Stretch'},
  {id:'pounce', label:'Playful Pounce'}
];
const SHAPES = [
  {key:'head', label:'Circle — Head'},
  {key:'ears', label:'Triangles — Ears'},
  {key:'body', label:'Oval — Body'},
  {key:'legs', label:'Small Ovals — Legs'},
  {key:'tail', label:'Curved Line — Tail'}
];
const SHAPE_NEUTRAL = 'rgba(255,244,227,0.20)';
const SHAPE_STROKE = 'rgba(255,244,227,0.6)';
const SHAPE_GLOW = '#FF7A33';
const SHAPE_GLOW_STROKE = '#E85C1A';

/* ============ state ============ */
const state = {
  step: 0, // 0 intro, 1-5 steps, 6 finish
  step1Phase: 'shapes', // 'shapes' warm-up, then 'pose'
  shapeHighlight: 'head',
  pose: null,
  bg: null,
  cat: null,
  candies: [], // ids placed
  features: {eyes:false, noseMouth:false, whiskers:false, collar:false}
};

const STEP_META = [
  null,
  {eyebrow:'Step 1 of 5', title:"Pick Your Cat's Pose!", sub:"Cats can stretch, sit, jump, or reach! Which pose should our cat show off?"},
  {eyebrow:'Step 2 of 5', title:"Choose a Background Color", sub:"Pick a color that makes your cat pop! We want lots of contrast."},
  {eyebrow:'Step 3 of 5', title:"Paint the Cat", sub:"One color works best — black, grey, or brown — so it stands out from the background."},
  {eyebrow:'Step 4 of 5', title:"Fill the Candy Jar!", sub:"Tap candies to drop them in the jar. Add at least two BIG ones!"},
  {eyebrow:'Step 5 of 5', title:"Add the Finishing Details", sub:"Every cat needs a face! Tap each detail to add it."}
];

/* ============ boot: sky decorations ============ */
function buildSky(){
  const sky = document.getElementById('sky');
  sky.innerHTML = `<div class="moon"></div>`;
  for(let i=0;i<26;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2.4+1.2;
    s.style.width=s.style.height=size+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*55+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    sky.appendChild(s);
  }
  const batShapes = [ [10,14],[70,26],[30,40],[85,8],[50,48] ];
  batShapes.forEach(([l,t],i)=>{
    const b = document.createElement('div');
    b.className='bat';
    b.style.left=l+'%'; b.style.top=t+'%'; b.style.animationDelay=(i*0.6)+'s';
    b.innerHTML = `<svg viewBox="0 0 40 20"><path d="M20 10 C16 2 6 2 0 8 C6 8 10 10 14 8 C16 12 14 16 10 18 C16 18 19 14 20 10 C21 14 24 18 30 18 C26 16 24 12 26 8 C30 10 34 8 40 8 C34 2 24 2 20 10 Z" fill="#150C29"/></svg>`;
    sky.appendChild(b);
  });
}

/* ============ progress trail ============ */
function renderTrail(){
  const trail = document.getElementById('trail');
  let html = '';
  for(let i=1;i<=5;i++){
    const cls = state.step===i ? 'active' : (state.step>i ? 'done' : '');
    html += `<div class="paw ${cls}">${pawSVG()}</div>`;
    if(i<5) html += `<div class="connector"></div>`;
  }
  trail.innerHTML = html;
}

/* ============ cat stage SVG (persistent) ============ */
function catStageMarkup(){
  return `
  <svg id="catStage" viewBox="0 0 320 320" xmlns="${NS}">
    <rect id="bgRect" x="8" y="8" width="304" height="304" rx="26"/>
    <g id="catGroup" class="pose-sit" transform="translate(160,190)">
      <g id="tailGroup"><path id="tailPath" d="M55,15 Q105,-5 92,-48" stroke-width="20" fill="none" stroke-linecap="round"/></g>
      <g id="legsBack">
        <ellipse cx="-38" cy="72" rx="16" ry="22"/>
        <ellipse cx="38" cy="72" rx="16" ry="22"/>
      </g>
      <ellipse id="bodyEllipse" cx="0" cy="18" rx="70" ry="56"/>
      <g id="legFrontL"><ellipse cx="-26" cy="76" rx="14" ry="24"/></g>
      <g id="legFrontR"><ellipse cx="26" cy="76" rx="14" ry="24"/></g>
      <g id="headGroup" transform="translate(0,-68)">
        <polygon class="earPoly" points="-46,-28 -27,-64 -9,-34"/>
        <polygon class="earPoly" points="46,-28 27,-64 9,-34"/>
        <circle id="headCircle" r="50"/>
        <g id="featEyes" class="feature hidden">
          <ellipse cx="-18" cy="-6" rx="9" ry="12" fill="#fff"/><circle cx="-18" cy="-4" r="4.2" fill="#231830"/>
          <ellipse cx="18" cy="-6" rx="9" ry="12" fill="#fff"/><circle cx="18" cy="-4" r="4.2" fill="#231830"/>
        </g>
        <g id="featNoseMouth" class="feature hidden">
          <path d="M-6,9 L6,9 L0,17 Z" fill="#FF9FB4"/>
          <path d="M0,17 Q-11,27 -22,19 M0,17 Q11,27 22,19" stroke="#2A1E1E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </g>
        <g id="featWhiskers" class="feature hidden">
          <path d="M-15,11 L-58,3 M-15,16 L-58,16 M-15,21 L-58,29" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
          <path d="M15,11 L58,3 M15,16 L58,16 M15,21 L58,29" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
        </g>
      </g>
      <g id="featCollar" class="feature hidden" transform="translate(0,-18)">
        <path d="M-38,-2 Q0,20 38,-2" stroke="#FF7A33" stroke-width="10" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="16" r="8" fill="#FFD23F" stroke="#E0A93A" stroke-width="2"/>
      </g>
    </g>
  </svg>`;
}

function jarMarkup(){
  return `
  <svg id="jarSvg" viewBox="0 0 120 150" xmlns="${NS}">
    <path d="M30,26 Q30,10 60,10 Q90,10 90,26 L90,30 L30,30 Z" fill="#C9A6E8" opacity=".85"/>
    <path id="jarBody" d="M22,34 Q18,110 30,132 Q60,146 90,132 Q102,110 98,34 Z"
      fill="rgba(255,255,255,0.10)" stroke="#FFF4E3" stroke-width="3" stroke-linejoin="round"/>
    <g id="candySlots"></g>
  </svg>`;
}

/* update stage visuals from state */
function applyStageState(){
  const catGroup = document.getElementById('catGroup');
  const bgRect = document.getElementById('bgRect');
  const stage = document.getElementById('catStage');
  if(!stage) return;

  catGroup.setAttribute('class', 'pose-' + (state.pose || 'sit'));
  bgRect.setAttribute('fill', state.bg ? BG_COLORS.find(c=>c.id===state.bg).hex : 'rgba(255,255,255,0.08)');
  const catFill = state.cat ? CAT_COLORS.find(c=>c.id===state.cat).hex : 'rgba(255,255,255,0.35)';
  stage.querySelectorAll('#tailPath, #legsBack ellipse, #bodyEllipse, #legFrontL ellipse, #legFrontR ellipse, #headGroup polygon, #headGroup circle')
    .forEach(el=>{ if(el.tagName==='path'){ el.setAttribute('stroke', catFill);} else { el.setAttribute('fill', catFill);} });

  Object.entries(state.features).forEach(([key,on])=>{
    const idMap = {eyes:'featEyes', noseMouth:'featNoseMouth', whiskers:'featWhiskers', collar:'featCollar'};
    const el = document.getElementById(idMap[key]);
    if(el){ el.classList.toggle('hidden', !on); el.classList.toggle('shown', on); }
  });

  const jarWrap = document.getElementById('jarWrap');
  if(jarWrap) jarWrap.classList.toggle('show', state.step>=4);
}

/* shapes warm-up: highlight one basic shape at a time on a neutral cat outline */
function renderShapesMode(){
  const stage = document.getElementById('catStage');
  if(!stage) return;
  const bgRect = document.getElementById('bgRect');
  bgRect.setAttribute('fill', 'rgba(255,255,255,0.05)');

  const groups = {
    head: stage.querySelectorAll('#headCircle'),
    ears: stage.querySelectorAll('.earPoly'),
    body: stage.querySelectorAll('#bodyEllipse'),
    legs: stage.querySelectorAll('#legsBack ellipse, #legFrontL ellipse, #legFrontR ellipse'),
    tail: stage.querySelectorAll('#tailPath')
  };
  Object.entries(groups).forEach(([key, els])=>{
    const active = state.shapeHighlight === key;
    els.forEach(el=>{
      if(el.tagName.toLowerCase()==='path'){
        el.setAttribute('fill','none');
        el.setAttribute('stroke', active ? SHAPE_GLOW : SHAPE_STROKE);
        el.setAttribute('stroke-width', active ? '22' : '18');
      } else {
        el.setAttribute('fill', active ? SHAPE_GLOW : SHAPE_NEUTRAL);
        el.setAttribute('stroke', active ? SHAPE_GLOW_STROKE : SHAPE_STROKE);
        el.setAttribute('stroke-width', active ? '2.5' : '1.5');
        el.setAttribute('stroke-dasharray', active ? '0' : '4 3');
      }
    });
  });
  const catGroup = document.getElementById('catGroup');
  catGroup.setAttribute('class','pose-sit');
}

const MAX_CANDIES = 10;

function renderCandiesInJar(){
  const slots = document.getElementById('candySlots');
  if(!slots) return;
  slots.innerHTML='';
  const positions = [
    [40,126],[60,126],[80,126],
    [38,108],[60,108],[82,108],
    [45,90],[75,90],
    [52,74],[68,74]
  ];
  state.candies.forEach((cid,i)=>{
    const def = CANDY_DEFS.find(c=>c.id===cid);
    const [x,y] = positions[i] || [60,60];
    const size = def.big ? 34 : 24;
    const g = document.createElementNS(NS,'g');
    g.setAttribute('transform', `translate(${x-size/2},${y-size/2}) rotate(${(i%2?-1:1)*(6+i*3)},${size/2},${size/2})`);
    g.innerHTML = def.svg.replace('<svg viewBox="0 0 40 40">','').replace('</svg>','');
    g.setAttribute('width', size); g.setAttribute('height', size);
    const wrapper = document.createElementNS(NS,'svg');
    wrapper.setAttribute('x', x-size/2); wrapper.setAttribute('y', y-size/2);
    wrapper.setAttribute('width', size); wrapper.setAttribute('height', size);
    wrapper.setAttribute('viewBox','0 0 40 40');
    wrapper.innerHTML = def.svg.match(/<svg[^>]*>([\s\S]*)<\/svg>/)[1];
    slots.appendChild(wrapper);
  });
}

/* ============ mascot lines ============ */
const MASCOT = {
  0: "Hi, I'm Whiskers! Today we're painting a Halloween cat with a candy jar. Ready to help me pick?",
  1: "Every cat has its own style. Watch how my whole body changes when you pick a pose!",
  2: "Remember — no bright pink here! We want a color that really makes the cat stand out.",
  3: "One color is best for a first cat painting. Look how it pops against the background!",
  4: "Big candies AND small candies make the jar look interesting. Don't forget at least two big ones!",
  5: "Eyes, nose, whiskers, and a collar — tap each one and watch my face come to life!",
  6: "We did it! Look at that spooky, sweet masterpiece."
};
const MASCOT_SHAPES = "Look closely — I'm just circles, ovals, and triangles! Tap a shape below to find it on me.";
function getMascotText(){
  if(state.step===1 && state.step1Phase==='shapes') return MASCOT_SHAPES;
  return MASCOT[state.step];
}

/* ============ render panel per step ============ */
function renderMain(){
  const main = document.getElementById('main');
  renderTrail();

  if(state.step===0){ main.innerHTML = introMarkup(); attachIntro(); return; }
  if(state.step===6){ main.innerHTML = finishMarkup(); attachFinish(); launchConfetti(); return; }

  const showShapesIntro = (state.step===1 && state.step1Phase==='shapes');

  main.innerHTML = `
    <section class="stagecard">
      <div class="stage-row">
        ${catStageMarkup()}
        ${showShapesIntro ? '' : `<div class="jar-wrap" id="jarWrap">${jarMarkup()}</div>`}
      </div>
      <div class="mascot-line">
        <div>
          <div class="who">🐾 Whiskers says</div>
          <p id="mascotText">${getMascotText()}</p>
        </div>
      </div>
    </section>
    <section class="panel" id="panel"></section>
  `;

  if(showShapesIntro){
    renderShapesMode();
  } else {
    applyStageState();
    renderCandiesInJar();
  }
  renderStepPanel();
}

function navBar(nextLabel, nextEnabled=true){
  const backLabel = (state.step===1 && state.step1Phase==='pose') ? '← Back to Shapes' : '← Back';
  return `
    <div class="nav">
      <button class="btn btn-ghost" id="backBtn">${backLabel}</button>
      <button class="btn btn-primary" id="nextBtn" ${nextEnabled?'':'disabled'}>${nextLabel}</button>
    </div>`;
}

function renderStepPanel(){
  const panel = document.getElementById('panel');

  if(state.step===1 && state.step1Phase==='shapes'){
    panel.innerHTML = `
      <p class="eyebrow">Step 1 of 5 · Warm-Up</p>
      <h2 class="step-title">What Shapes Make a Cat?</h2>
      <p class="step-sub">Before we draw, let's spot the simple shapes hiding inside every cat.</p>
      <div class="shape-chip-list">
        ${SHAPES.map(s=>`
          <button class="shape-chip ${state.shapeHighlight===s.key?'active':''}" data-shape="${s.key}">
            <span class="chip-shape ${s.key}"></span> ${s.label}
          </button>`).join('')}
      </div>
      <p class="hint">💡 Tap a shape name to see where it is on the cat.</p>
      <div class="nav">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Let's Pick a Pose! →</button>
      </div>
    `;
    attachStepEvents();
    return;
  }

  const meta = STEP_META[state.step];
  let body = '';

  if(state.step===1){
    body = `<div class="choices">
      ${POSES.map(p=>`
        <div class="choice-card ${state.pose===p.id?'selected':''}" data-pose="${p.id}" tabindex="0" role="button">
          ${poseThumb(p.id)}
          ${p.label}
        </div>`).join('')}
    </div>
    <p class="hint">💡 Tip: the cat's head should be bigger than your own open hand!</p>`;
  }

  if(state.step===2){
    body = `<div class="choices swatches">
      ${BG_COLORS.map(c=>`
        <div class="choice-card ${state.bg===c.id?'selected':''}" data-bg="${c.id}" tabindex="0" role="button">
          <div class="swatch" style="background:${c.hex}"></div>
          ${c.label}
        </div>`).join('')}
    </div>
    <p class="hint">💡 Tip: skip bright pink — it doesn't show up well behind our cat.</p>`;
  }

  if(state.step===3){
    body = `<div class="choices swatches">
      ${CAT_COLORS.map(c=>`
        <div class="choice-card ${state.cat===c.id?'selected':''}" data-cat="${c.id}" tabindex="0" role="button">
          <div class="swatch" style="background:${c.hex}"></div>
          ${c.label}
        </div>`).join('')}
    </div>
    <p class="hint">💡 Tip: one solid color dries fast and looks bold — save patterns for later!</p>`;
  }

  if(state.step===4){
    const bigCount = state.candies.filter(id=>CANDY_DEFS.find(c=>c.id===id).big).length;
    const isFull = state.candies.length >= MAX_CANDIES;
    body = `
      <p class="jar-status ${isFull?'full':''}">
        ${isFull ? '🎉 The jar is full!' : `In the jar: ${state.candies.length} / ${MAX_CANDIES} candies (${bigCount} big)`}
      </p>
      <div class="tray">
        ${CANDY_DEFS.map(c=>`
          <button class="candy-btn ${isFull?'used':''}" data-candy="${c.id}" aria-label="Add candy" ${isFull?'disabled':''}>
            ${c.svg}
          </button>`).join('')}
      </div>
      <p class="hint">💡 Tip: make at least two candies BIG — bigger than a marker cap! Tap the same candy more than once if you like it.</p>
      <div class="nav" style="margin-top:10px;">
        <button class="btn btn-ghost" id="resetCandy">Empty the jar</button>
      </div>`;
  }

  if(state.step===5){
    const items = [
      {key:'eyes', label:'Eyes'}, {key:'noseMouth', label:'Nose & Mouth'},
      {key:'whiskers', label:'Whiskers'}, {key:'collar', label:'Collar & Bell'}
    ];
    body = `
      <p class="step-sub" style="margin-bottom:8px;">Tap each detail below to add it to the cat.</p>
      <div class="feature-tray">
        ${items.map(it=>`
          <button class="feat-btn ${state.features[it.key]?'done':''}" data-feat="${it.key}">
            <span class="dot">${state.features[it.key]?'✓':''}</span> ${it.label}
          </button>`).join('')}
      </div>`;
  }

  panel.innerHTML = `
    <p class="eyebrow">${meta.eyebrow}</p>
    <h2 class="step-title">${meta.title}</h2>
    <p class="step-sub">${meta.sub}</p>
    ${body}
    ${state.step===4 ? '' : navBar(state.step===5 ? "See My Cat! →" : 'Next →')}
  `;

  if(state.step===4){
    panel.insertAdjacentHTML('beforeend', navBar('Next →'));
  }

  attachStepEvents();
}

function poseThumb(id){
  // tiny illustrative icon per pose using simple shapes
  const shapes = {
    sit: `<circle cx="32" cy="20" r="12" fill="#cfd3e6"/><ellipse cx="32" cy="42" rx="18" ry="16" fill="#cfd3e6"/>`,
    reach: `<circle cx="30" cy="20" r="12" fill="#cfd3e6"/><ellipse cx="32" cy="42" rx="18" ry="16" fill="#cfd3e6"/><ellipse cx="16" cy="26" rx="6" ry="12" fill="#cfd3e6" transform="rotate(-40 16 26)"/>`,
    stretch: `<ellipse cx="32" cy="34" rx="26" ry="12" fill="#cfd3e6"/><circle cx="10" cy="26" r="10" fill="#cfd3e6"/>`,
    pounce: `<ellipse cx="32" cy="40" rx="20" ry="14" fill="#cfd3e6"/><circle cx="32" cy="20" r="11" fill="#cfd3e6"/><path d="M50,40 Q60,26 52,16" stroke="#cfd3e6" stroke-width="6" fill="none" stroke-linecap="round"/>`
  };
  return `<svg viewBox="0 0 64 56" xmlns="${NS}">${shapes[id]}</svg>`;
}

/* ============ event wiring ============ */
function attachStepEvents(){
  document.querySelectorAll('[data-shape]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.shapeHighlight = el.dataset.shape; renderMain(); });
  });
  document.querySelectorAll('[data-pose]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.pose = el.dataset.pose; renderMain(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ state.pose = el.dataset.pose; renderMain(); }});
  });
  document.querySelectorAll('[data-bg]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.bg = el.dataset.bg; renderMain(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ state.bg = el.dataset.bg; renderMain(); }});
  });
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.cat = el.dataset.cat; renderMain(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ state.cat = el.dataset.cat; renderMain(); }});
  });
  document.querySelectorAll('[data-candy]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.candy;
      if(state.candies.length < MAX_CANDIES){
        state.candies.push(id);
        renderMain();
      }
    });
  });
  const resetCandy = document.getElementById('resetCandy');
  if(resetCandy) resetCandy.addEventListener('click', ()=>{ state.candies=[]; renderMain(); });

  document.querySelectorAll('[data-feat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.feat;
      state.features[key] = !state.features[key];
      renderMain();
    });
  });

  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    if(state.step===1 && state.step1Phase==='shapes'){ state.step=0; renderMain(); return; }
    if(state.step===1 && state.step1Phase==='pose'){ state.step1Phase='shapes'; renderMain(); return; }
    state.step--; renderMain();
  });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(state.step===1 && state.step1Phase==='shapes'){ state.step1Phase='pose'; renderMain(); return; }
    state.step = Math.min(6, state.step+1);
    renderMain();
  });
}

/* ============ intro / finish ============ */
function introMarkup(){
  return `
  <section class="full stagecard" style="grid-column:1/-1;">
    <p class="eyebrow">A Halloween Class Activity · Ages 4–6</p>
    <h1>🎃 Paws for Candy</h1>
    <p>Help design a Halloween cat painting, step by step — pick a pose, choose colors, fill a candy jar, and give your cat some spooky-sweet details!</p>
    <div class="badge-row">
      <div class="badge">🐾 5 fun steps</div>
      <div class="badge">🎨 Real painting vocabulary</div>
      <div class="badge">🍬 A candy jar to fill</div>
    </div>
    <button class="btn btn-primary" id="startBtn">Let's Start! →</button>
  </section>`;
}
function attachIntro(){
  document.getElementById('startBtn').addEventListener('click', ()=>{ state.step=1; renderMain(); });
}

function finishMarkup(){
  const catHex = state.cat ? CAT_COLORS.find(c=>c.id===state.cat).hex : '#33303F';
  const bgHex = state.bg ? BG_COLORS.find(c=>c.id===state.bg).hex : '#FFD23F';
  return `
  <section class="full stagecard" style="grid-column:1/-1;">
    <p class="eyebrow">All Done!</p>
    <h1>🎉 Your Halloween Cat is Ready</h1>
    <div class="stage-row" style="margin:14px 0 6px;">
      ${catStageMarkup()}
      <div class="jar-wrap show" id="jarWrap">${jarMarkup()}</div>
    </div>
    <p style="margin-top:18px;">Great job! Now it's time to paint for real with a canvas, paint, and markers.</p>
    <p class="eyebrow" style="margin-top:24px;">🏠 Homework</p>
    <p>Design a Halloween costume for your cat — maybe a superhero, a witch, or even a pumpkin!</p>
    <div class="costume-row">
      <div class="costume-card">${costumeIcon('hero')} Superhero</div>
      <div class="costume-card">${costumeIcon('witch')} Witch</div>
      <div class="costume-card">${costumeIcon('pumpkin')} Pumpkin</div>
    </div>
    <div class="nav" style="justify-content:center; margin-top:26px;">
      <button class="btn btn-primary" id="restartBtn">Start Over 🐾</button>
    </div>
  </section>`;
}
function costumeIcon(type){
  if(type==='hero') return `<svg viewBox="0 0 64 56"><circle cx="32" cy="20" r="12" fill="#FF5C8A"/><path d="M14,44 L32,26 L50,44 Z" fill="#FF7A33"/></svg>`;
  if(type==='witch') return `<svg viewBox="0 0 64 56"><path d="M12,30 L52,30 L32,6 Z" fill="#7C6AD8"/><rect x="6" y="30" width="52" height="6" rx="3" fill="#33303F"/></svg>`;
  return `<svg viewBox="0 0 64 56"><ellipse cx="32" cy="32" rx="22" ry="16" fill="#FF9F45"/><rect x="29" y="10" width="6" height="12" fill="#7C9A5A"/></svg>`;
}
function attachFinish(){
  applyStageState();
  renderCandiesInJar();
  document.getElementById('restartBtn').addEventListener('click', resetAll);
}

function resetAll(){
  state.step=0; state.step1Phase='shapes'; state.shapeHighlight='head';
  state.pose=null; state.bg=null; state.cat=null; state.candies=[];
  state.features={eyes:false, noseMouth:false, whiskers:false, collar:false};
  renderMain();
}

/* ============ confetti ============ */
function launchConfetti(){
  const colors = ['#FF7A33','#FFD23F','#FF5C8A','#C9A6E8','#A6D8F0'];
  for(let i=0;i<50;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animation = `fall ${2.2+Math.random()*1.6}s linear ${Math.random()*0.6}s forwards`;
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4500);
  }
}
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes fall{ to{ transform:translateY(100vh) rotate(360deg); opacity:.9; } }
.pose-reach #legFrontR{ transform: rotate(-55deg); transform-box:fill-box; transform-origin:top center; transition:transform .35s ease;}
.pose-reach #headGroup{ transform: translate(0,-72px) rotate(-6deg); transition:transform .35s ease;}
.pose-stretch #bodyEllipse{ transform: scale(1.28,0.72); transform-box:fill-box; transform-origin:center; transition:transform .35s ease;}
.pose-stretch #tailGroup{ transform: rotate(18deg); transform-box:fill-box; transform-origin:left center; transition:transform .35s ease;}
.pose-stretch #headGroup{ transform: translate(0,-58px) rotate(6deg); transition:transform .35s ease;}
.pose-pounce #catGroup, #catGroup.pose-pounce{ }
.pose-pounce #tailGroup{ transform: rotate(-65deg) translateY(-6px); transform-box:fill-box; transform-origin:left center; transition:transform .35s ease;}
.pose-pounce #headGroup{ transform: translate(0,-64px) rotate(-6deg); transition:transform .35s ease;}
.pose-pounce #bodyEllipse{ transform: scale(1,0.9); transform-box:fill-box; transform-origin:center; transition:transform .35s ease;}
#tailGroup, #headGroup, #bodyEllipse, #legFrontR, #legFrontL{ transition:transform .35s ease; }
`;
document.head.appendChild(styleSheet);

/* ============ boot ============ */
buildSky();
renderMain();
</script>
</body>
</html>
